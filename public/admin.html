<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Bot Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .container {
            width: 100%;
            max-width: 900px;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .section-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .section-card h2 {
            font-size: 1.25rem;
            margin: 0 0 1.5rem 0;
            color: #fff;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.75rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input[type="text"], input[type="password"], textarea, select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
        }

        .range-value {
            background: var(--input-bg);
            padding: 0.25rem 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            min-width: 3rem;
            text-align: center;
            border: 1px solid var(--glass-border);
        }

        .button-container {
            position: sticky;
            bottom: 2rem;
            z-index: 100;
            display: flex;
            justify-content: center;
            margin-top: 3rem;
        }

        button {
            width: 100%;
            max-width: 400px;
            background: var(--accent);
            color: white;
            border: none;
            padding: 1.25rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5);
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.6);
        }
        
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .toast {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: #10b981;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 500;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
            transform: translateY(-100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Command Center</h1>
            <p class="subtitle">Complete system configuration and integrations</p>
        </header>

        <form id="settings-form">
            <!-- Access Controls -->
            <div class="section-card">
                <h2>1. Access & General Settings</h2>
                <div class="form-group">
                    <label for="allowedChatIds">Allowed Telegram Chat IDs (comma separated)</label>
                    <input type="text" id="allowedChatIds" required placeholder="e.g. 123456789,987654321">
                </div>
            </div>

            <!-- AI Settings -->
            <div class="section-card">
                <h2>2. AI Behavior & Quality</h2>
                
                <div class="grid-2">
                    <div class="form-group">
                        <label for="copyModel">Copywriter LLM Model</label>
                        <input type="text" id="copyModel" placeholder="e.g. deepseek/deepseek-chat">
                    </div>
                    <div class="form-group">
                        <label for="imageModel">Image Model (no text on image)</label>
                        <input type="text" id="imageModel" placeholder="e.g. fal-ai/flux-2/turbo">
                    </div>
                    <div class="form-group">
                        <label for="textImageModel">Image Model (text on image)</label>
                        <input type="text" id="textImageModel" placeholder="e.g. fal-ai/nano-banana-2">
                    </div>
                    <div class="form-group">
                        <label for="imageEditModel">Photo Edit Model (add text to photos)</label>
                        <input type="text" id="imageEditModel" placeholder="e.g. fal-ai/nano-banana-2/edit">
                    </div>
                    <div class="form-group">
                        <label for="imageAspect">Image Aspect Ratio</label>
                        <select id="imageAspect">
                            <option value="1:1">1:1 — Square (Instagram feed)</option>
                            <option value="4:3">4:3 — Landscape</option>
                            <option value="3:4">3:4 — Portrait</option>
                            <option value="16:9">16:9 — Wide</option>
                            <option value="9:16">9:16 — Story / Reel</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="brandStyle">Brand Style (woven into every image prompt)</label>
                    <textarea id="brandStyle" placeholder="e.g. Warm golden lighting, coral and navy palette, friendly small-business feel — never corporate stock-photo look"></textarea>
                </div>

                <div class="form-group">
                    <label for="copySystemPrompt">Image Prompt Enhancer — System Prompt (Master Instructions)</label>
                    <textarea id="copySystemPrompt" required></textarea>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Image Detail Level (Inference Steps)</label>
                        <div class="range-container">
                            <input type="range" id="fluxInferenceSteps" min="20" max="50" step="1" oninput="updateRange('fluxInferenceSteps')">
                            <span class="range-value" id="fluxInferenceSteps-val">35</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Prompt Adherence (Guidance Scale)</label>
                        <div class="range-container">
                            <input type="range" id="fluxGuidanceScale" min="1.0" max="10.0" step="0.1" oninput="updateRange('fluxGuidanceScale')">
                            <span class="range-value" id="fluxGuidanceScale-val">3.5</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- API Integrations -->
            <div class="section-card">
                <h2>3. API Integrations (Secret Keys)</h2>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="openRouterApiKey">OpenRouter API Key (Primary LLM)</label>
                        <input type="password" id="openRouterApiKey" placeholder="sk-or-v1-...">
                    </div>
                    <div class="form-group">
                        <label for="falKey">Fal.ai Key (Flux Image Gen)</label>
                        <input type="password" id="falKey" placeholder="key:secret">
                    </div>
                    <div class="form-group">
                        <label for="anthropicApiKey">Anthropic API Key (Fallback)</label>
                        <input type="password" id="anthropicApiKey" placeholder="sk-ant-...">
                    </div>
                    <div class="form-group">
                        <label for="deepseekApiKey">DeepSeek API Key (Fallback)</label>
                        <input type="password" id="deepseekApiKey" placeholder="sk-...">
                    </div>
                    <div class="form-group">
                        <label for="zernioApiKey">Zernio API Key (Publisher)</label>
                        <input type="password" id="zernioApiKey" placeholder="sk_...">
                    </div>
                </div>
            </div>

            <div class="button-container">
                <button type="submit" id="save-btn">Deploy Configuration Safely</button>
            </div>
        </form>
    </div>

    <div class="toast" id="toast">Settings deployed to production successfully!</div>

    <script>
        function updateRange(id) {
            document.getElementById(id + '-val').textContent = document.getElementById(id).value;
        }

        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                if (!res.ok) throw new Error('Unauthorized');
                const data = await res.json();
                
                const fields = [
                    'allowedChatIds', 'copySystemPrompt', 'copyModel',
                    'imageModel', 'textImageModel', 'imageEditModel', 'imageAspect', 'brandStyle',
                    'openRouterApiKey', 'anthropicApiKey', 'deepseekApiKey', 'falKey', 'zernioApiKey'
                ];
                
                fields.forEach(f => {
                    if(document.getElementById(f)) {
                        document.getElementById(f).value = data[f] || '';
                    }
                });
                
                document.getElementById('fluxInferenceSteps').value = data.fluxInferenceSteps;
                updateRange('fluxInferenceSteps');
                
                document.getElementById('fluxGuidanceScale').value = data.fluxGuidanceScale;
                updateRange('fluxGuidanceScale');
            } catch (err) {
                console.error(err);
                if (err.message === 'Unauthorized') {
                    window.location.reload(); 
                }
            }
        }

        document.getElementById('settings-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.textContent = 'Deploying...';

            const payload = {
                allowedChatIds: document.getElementById('allowedChatIds').value,
                copySystemPrompt: document.getElementById('copySystemPrompt').value,
                copyModel: document.getElementById('copyModel').value,
                imageModel: document.getElementById('imageModel').value,
                textImageModel: document.getElementById('textImageModel').value,
                imageEditModel: document.getElementById('imageEditModel').value,
                imageAspect: document.getElementById('imageAspect').value,
                brandStyle: document.getElementById('brandStyle').value,
                openRouterApiKey: document.getElementById('openRouterApiKey').value,
                anthropicApiKey: document.getElementById('anthropicApiKey').value,
                deepseekApiKey: document.getElementById('deepseekApiKey').value,
                falKey: document.getElementById('falKey').value,
                zernioApiKey: document.getElementById('zernioApiKey').value,
                fluxInferenceSteps: parseInt(document.getElementById('fluxInferenceSteps').value),
                fluxGuidanceScale: parseFloat(document.getElementById('fluxGuidanceScale').value),
            };

            try {
                await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            } catch (err) {
                console.error(err);
                alert("Failed to save settings.");
            } finally {
                btn.disabled = false;
                btn.textContent = 'Deploy Configuration Safely';
            }
        });

        loadSettings();
    </script>
</body>
</html>
